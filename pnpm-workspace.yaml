packages:
  - "."

# Hold every direct and transitive release for seven days before pnpm may
# resolve it. This applies to installs and future updates.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true

# Vite requires esbuild's platform binary setup. No other dependency lifecycle
# scripts are permitted.
allowBuilds:
  esbuild: true
