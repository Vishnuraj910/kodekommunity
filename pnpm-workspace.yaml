packages:
  - "."
  - "server"

overrides:
  "@fastify/static": 10.1.2
  effect: 3.20.0

# Hold every direct and transitive release for seven days before pnpm may
# resolve it. This applies to installs and future updates.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
engineStrict: true
saveExact: true
strictPeerDependencies: true
verifyStoreIntegrity: true

# Vite requires esbuild's platform binary setup. No other dependency lifecycle
# scripts are permitted.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
